# Asset de Diablo II a hornear CRUDO para este POC (lo parsea el codigo del motor en la consola).
# Los datos del juego NO entran al repo (scripts/check_repo_hygiene.sh lo prohibe): el .dc6, el .pal y
# los .go generados quedan en el directorio de build.
#
# DC-001.5: los MISMOS bytes que usa DC-002.9 (el logo de Battle.net y la paleta de carga). El punto de
# este POC no es que se vea: es que los 16 MB y el frame se midan CON EL MOTOR CARGADO, o sea con el
# asset real decodificado por d2dc6/d2dat, no con un relleno.
#
# Carpeta de Diablo II: se autodetecta en los caminos tipicos de Wine, o se pasa D2_DIR=...
mpq=d2data.mpq
dc6=data\global\ui\BIGMENU\D2LogoBnet.dc6
pal=data\global\palette\loading\pal.dat
name=d2logo
