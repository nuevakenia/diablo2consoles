# DC-002.10: la PANTALLA del motor en la Dreamcast (no una textura suelta). El mismo asset que el POC
# motor-menu, pero aca pasa por el camino del motor: se arma una imagen, se dibuja con DrawImage sobre la
# pantalla del juego (con la matriz de geometria, que es lo que la mueve) y la pantalla entera se sube a la
# VRAM. Lo que se ve no es "un asset pintado por el PVR": es UN CUADRO DEL MOTOR.
# Los datos del juego NO entran al repo: se hornean al build desde el MPQ.
# Carpeta de Diablo II: $D2_DIR o los caminos tipicos de Wine.
mpq=d2data.mpq
dc6=data\global\ui\BIGMENU\amazonback.DC6
pal=data\global\palette\act1\pal.pl2
frame=compuesto
name=menu
